name: Apply Unit 2 mission audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unit2-mission-audit-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited Unit 2 corrections
        run: python3 tools/unit2_mission_audit_fix.py

      - name: Validate JavaScript and patch integrity
        run: |
          node --check units/02-atomic-structure/js/main.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          html = Path('units/02-atomic-structure/index.html').read_text(encoding='utf-8')
          js = Path('units/02-atomic-structure/js/main.js').read_text(encoding='utf-8')
          css = Path('units/02-atomic-structure/css/style.css').read_text(encoding='utf-8')
          required = [
              'CONFIG_CHALLENGES',
              'configurationChallengeArt',
              'practiceVerdict',
              'configChoices',
              "this.elZ = 6; this.onElement();",
              "Photon energy (eV)",
              "modeVerdict.mass.tone==='success'",
              "modeVerdict.spectra.tone==='success'",
              "focusScenario('config', familySc)",
              'config-choice-grid'
          ]
          blob = js + '\n' + html + '\n' + css
          missing = [x for x in required if x not in blob]
          if missing:
              raise SystemExit(f'Missing required Unit 2 fix markers: {missing}')
          forbidden = [
              'this.elZ = this.buildSc.z',
              'this.nNeutrons = this.buildSc.n',
              'BORON ISOTOPES · WEIGHTED AVERAGE 10.81 u',
              'COPPER ISOTOPES · WEIGHTED AVERAGE 63.55 u',
              'CHLORINE ISOTOPES · 75.77% Cl-35'
          ]
          present = [x for x in forbidden if x in blob]
          if present:
              raise SystemExit(f'Answer-revealing Unit 2 markers remain: {present}')
          print('Static Unit 2 mission validation passed.')
          PY

      - name: Commit Unit 2 fix and remove temporary patch machinery
        run: |
          rm -f tools/unit2_mission_audit_fix.py .github/workflows/unit2-mission-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair Unit 2 mission prompts and answer flow"
          git push origin main
