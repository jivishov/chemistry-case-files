name: Unit 10 final audit cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Apply audited cleanup
        shell: bash
        run: |
          git show HEAD^:.github/workflows/unit10-final-cleanup.yml > /tmp/previous.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/previous.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n          git diff --check"
          a = text.index(start) + len(start)
          b = text.index(end, a)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[a:b].splitlines())
          marker = "files = ["
          global_cleanup = """
          # Normalize any remaining legacy ASCII notation anywhere in the audited Unit 10 source.
          for _p in [
              'units/10-thermochemistry/index.html', 'units/10-thermochemistry/js/model.js',
              'units/10-thermochemistry/js/main.js', 'units/10-thermochemistry/js/case.js',
              'units/10-thermochemistry/js/art.js']:
              _f = Path(_p)
              _s = _f.read_text(encoding='utf-8').replace('q = mc(dT)', 'q = mcΔT')
              _f.write_text(_s, encoding='utf-8')
          """
          code = code.replace(marker, global_cleanup + '\n' + marker, 1)
          exec(compile(code, '/tmp/unit10_final.py', 'exec'), {'__name__':'__main__'})
          PY
          git diff --check

      - name: Check laptop layouts
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/u10-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{width:1536,height:864},{width:1366,height:768}]){
              const page=await browser.newPage({viewport:vp});
              await page.goto('http://127.0.0.1:8000/units/10-thermochemistry/',{waitUntil:'networkidle'});
              await page.waitForSelector('.station-nav');
              const m=await page.evaluate(()=>{
                const q=s=>document.querySelector(s), nav=q('.station-nav'), screen=q('.mission-screen'), con=q('.chem-console');
                const tabs=[...document.querySelectorAll('.station-nav .tab')];
                return {bodyX:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  navX:nav.scrollWidth-nav.clientWidth,screenX:screen.scrollWidth-screen.clientWidth,
                  consoleX:con.scrollWidth-con.clientWidth,
                  wrappedTabs:tabs.filter(t=>t.scrollHeight>t.clientHeight+1||t.scrollWidth>t.clientWidth+1).length,
                  bodyH:document.documentElement.scrollHeight,viewportH:innerHeight};
              });
              console.log(`${vp.width}x${vp.height}: ${JSON.stringify(m)}`);
              if(m.bodyX>1||m.navX>1||m.screenX>1||m.consoleX>1||m.wrappedTabs>0) throw new Error(`overflow/wrapping at ${vp.width}x${vp.height}`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Commit audited source
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          git rm .github/workflows/unit10-final-cleanup.yml
          git add units/10-thermochemistry/index.html units/10-thermochemistry/js/model.js \
                  units/10-thermochemistry/js/main.js units/10-thermochemistry/js/case.js \
                  units/10-thermochemistry/js/art.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Unit 10 language and fidelity audit"
          git push origin HEAD:main
