name: Unit 10 final audit cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Clean final wording and notation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          patch('units/10-thermochemistry/index.html', [
            ('title="Size the heat · C.13(D) q = mc(dT)"', 'title="Size the heat · C.13(D) q = mcΔT"'),
            ('aria-label="Rescue status"', 'aria-label="Scenario status"'),
            ('1. Which pouch do you open?', '1. Which pack fits the required heat-transfer direction?'),
            ('>Use this pack</button>', '>Check pack</button>'),
            ('>Next patient</button>', '>Next scenario</button>'),
            ('<div class="k">change dT</div>', '<div class="k">change ΔT</div>'),
            ("'dT = ' + fmt(wm.dT) + ' C'", "'ΔT = ' + fmt(wm.dT) + ' C'"),
            ('>Next job</button>', '>Next scenario</button>'),
            ("!wmMat ? 'Say which specific heat applies.' : 'Now work out the heat and type it.'", "!wmMat ? 'Select the specific heat capacity first.' : 'Calculate the heat and enter it in kJ.'"),
            ("x-text=\"'Work out the settling temperature, then type it.'\"", "x-text=\"'Calculate the equilibrium temperature, then enter it.'\""),
            (">too cold</div><div class=\"gauge-seg\" :class=\"clVerdict.gauge==='on' ? 'on' : ''\">on target</div><div class=\"gauge-seg\" :class=\"clVerdict.gauge==='high' ? 'miss' : ''\">too hot</div>", ">prediction low</div><div class=\"gauge-seg\" :class=\"clVerdict.gauge==='on' ? 'on' : ''\">within tolerance</div><div class=\"gauge-seg\" :class=\"clVerdict.gauge==='high' ? 'miss' : ''\">prediction high</div>"),
            ('<div class="k">heat that moved</div>', '<div class="k">heat transferred</div>'),
            ('<div class="k">settles at</div>', '<div class="k">equilibrium T</div>'),
            ('>Next route</button>', '>Next reaction</button>'),
            ('<th class="num">dHf (kJ/mol)</th>', '<th class="num">ΔH°f (kJ/mol)</th>'),
            ('An element in its standard state has dHf = 0 by definition.', 'An element in its standard state has ΔH°f = 0 by definition.'),
            ('<label for="fmv">dHrxn (kJ)</label>', '<label for="fmv">ΔH°rxn (kJ)</label>'),
            ("'Work out dHrxn from the formation values, then type it.'", "'Calculate ΔH°rxn from the formation values, then enter it.'"),
            ('>Next fuel</button>', '>Next reaction</button>'),
            ('aria-label="Rescue readouts"', 'aria-label="Scenario readouts"'),
            ('aria-label="Latest consequence"', 'aria-label="Latest result"'),
          ])

          patch('units/10-thermochemistry/js/model.js', [
            ("text: \"Honors: combine measured steps with Hess's law to get the enthalpy of a route nobody can measure directly.\"",
             "text: \"Honors: use Hess's law to combine thermochemical equations and determine the enthalpy change of a target reaction.\""),
            ("text: 'Honors: calculate a reaction enthalpy from standard heats of formation.'",
             "text: 'Honors: calculate a reaction enthalpy from standard enthalpies of formation.'"),
            ('// World: "Heat Line". You are the thermal medic on a mountain rescue team. A climber\n// is going hypothermic on a ledge at 3,100 m. You carry chemical packs, a stove, a\n// pot, and a shelter, and every call you make is a heat calculation.',
             '// Scenario context: a fictional mountain setting connects the thermochemistry tasks.\n// Medical and aviation values in the capstone are explicitly labeled as activity criteria,\n// not real-world guidance.'),
            ('// SCENARIOS — the game layer for Heat Line. One coherent world: a climber going\n// hypothermic on a ledge, a team with packs, a stove, a pot, and a shelter.',
             '// SCENARIOS — evidence-forward thermochemistry tasks in a fictional mountain context.'),
          ])

          patch('units/10-thermochemistry/js/main.js', [
            ("{ id: 'd',   code: 'C.13(D)',  label: 'q = mc(dT)',", "{ id: 'd',   code: 'C.13(D)',  label: 'q = mcΔT',"),
            ("{ id: 'cap', code: 'Capstone', label: 'Evacuation call',", "{ id: 'cap', code: 'Capstone', label: 'Evidence synthesis',"),
            ('// The patient\'s core temperature is the world-state. These are the clinical bands a\n// rescue medic actually works to: the original simulation used a 32 C threshold, and 35 is the line between\n// mild and moderate hypothermia.',
             '// Core temperature is a fictional scenario-state variable used only to connect activities.\n// Its bands and movement cutoff are simulation mechanics, not clinical thresholds.'),
            ('// Shivering is the patient\'s own heat source and it fails below this. It is already the\n// line coreState() reads; naming it lets the rail\'s second meter show the margin left.',
             '// The capstone compares the scenario-state value with this activity-only movement criterion.'),
            ('// Two of them read the same thermometer and that is deliberate: Core is the raw\n// number the calls move, and Shiver is the clinical margin above 32 C, which is the\n// temperature at which she stops making any heat of her own. Shiver hits zero while\n// Core still shows a third of a bar, which is exactly the point a medic cares about.\n// Recent is the one that can fall while the other three rise.',
             '// Two meters derive from the same scenario-state temperature: Core shows the value;\n// the 33 C rule shows its distance from the explicitly simulation-only activity criterion.\n// Recent can fall while the progress-related meters rise.'),
            ('clinical thresholds the consequences turn on', 'simulation criteria used by the scenario'),
            ('>dH = ${p.dH > 0 ? \'+\' : \'\'}${p.dH} kJ</text>', '>ΔH = ${p.dH > 0 ? \'+\' : \'\'}${p.dH} kJ</text>'),
            ('but the target route is ${fmt(this.hs.target.dH)} kJ.', 'but the target enthalpy is ${fmt(this.hs.target.dH)} kJ.'),
            ('const truth = `dHrxn works out to ${fmt(this.fm.trueDH)} kJ, which is ${this.fm.trueClass}.`;',
             'const truth = `ΔH°rxn = ${fmt(this.fm.trueDH)} kJ, so the reaction is ${this.fm.trueClass}.`;'),
            ('A negative dH releases heat.', 'A negative ΔH corresponds to an exothermic reaction under the stated conditions.'),
          ])

          patch('units/10-thermochemistry/js/case.js', [
            ('q = m c (dT)', 'q = m c ΔT'),
            ('<text x="416" y="262" font-family="JetBrains Mono" font-size="10" fill="#24363f">Atwater total</text>', '<text x="416" y="262" font-family="JetBrains Mono" font-size="10" fill="#24363f">4-9-4 estimate</text>'),
            ('rounds to the 230 on the packet', '229 kcal before label rounding'),
          ])

          # Cache-bust final source revision.
          p = Path('units/10-thermochemistry/index.html')
          s = p.read_text(encoding='utf-8').replace('main.js?v=u10-2', 'main.js?v=u10-3').replace('case.js?v=u10-2', 'case.js?v=u10-3')
          p.write_text(s, encoding='utf-8')

          # Final wording/fidelity remnant checks.
          files = [
            'units/10-thermochemistry/index.html',
            'units/10-thermochemistry/js/model.js',
            'units/10-thermochemistry/js/main.js',
            'units/10-thermochemistry/js/case.js',
            'units/10-thermochemistry/js/art.js',
          ]
          text = '\n'.join(Path(f).read_text(encoding='utf-8') for f in files)
          forbidden = [
            'Every Calorie on that label came from setting food on fire',
            'Nobody estimated it',
            'Make the call',
            'Next patient',
            'Next job',
            'q = mc(dT)',
            'dHrxn works out',
            'clinical margin above 32 C',
            'safe only at or above 33 C core',
            'The dH arrow is to scale',
          ]
          for phrase in forbidden:
              if phrase in text:
                  raise SystemExit(f'forbidden remnant: {phrase}')
          PY
          git diff --check

      - name: Check 15-inch laptop layouts
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/u10-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const vp of [{width:1536,height:864},{width:1366,height:768}]) {
              const page = await browser.newPage({viewport:vp});
              await page.goto('http://127.0.0.1:8000/units/10-thermochemistry/', {waitUntil:'networkidle'});
              await page.waitForSelector('.station-nav');
              const m = await page.evaluate(() => {
                const q = s => document.querySelector(s);
                const nav = q('.station-nav');
                const screen = q('.mission-screen');
                const consoleEl = q('.chem-console');
                const tabs = [...document.querySelectorAll('.station-nav .tab')];
                return {
                  bodyX: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                  navX: nav.scrollWidth - nav.clientWidth,
                  screenX: screen.scrollWidth - screen.clientWidth,
                  consoleX: consoleEl.scrollWidth - consoleEl.clientWidth,
                  wrappedTabs: tabs.filter(t => t.scrollHeight > t.clientHeight + 1 || t.scrollWidth > t.clientWidth + 1).length,
                  bodyH: document.documentElement.scrollHeight,
                  viewportH: innerHeight,
                  title: document.title
                };
              });
              console.log(`${vp.width}x${vp.height}: ${JSON.stringify(m)}`);
              if (m.bodyX > 1 || m.navX > 1 || m.screenX > 1 || m.consoleX > 1 || m.wrappedTabs > 0) {
                throw new Error(`layout overflow/wrapping at ${vp.width}x${vp.height}`);
              }
              await page.close();
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS

      - name: Commit audited source
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          git rm .github/workflows/unit10-final-cleanup.yml
          git add units/10-thermochemistry/index.html \
                  units/10-thermochemistry/js/model.js \
                  units/10-thermochemistry/js/main.js \
                  units/10-thermochemistry/js/case.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Unit 10 language and fidelity audit"
          git push origin HEAD:main
