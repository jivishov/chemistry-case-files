name: Unit 5 fidelity refactor v7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unit5-fidelity-refactor-v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser checker and capture original laptop baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/u5-http.log 2>&1 &
          echo $! >/tmp/u5-http.pid
          mkdir -p /tmp/u5check
          cd /tmp/u5check
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/unit5_layout_compare.cjs" ./compare.cjs
          node compare.cjs baseline /tmp/u5-baseline.json

      - name: Normalize legacy source and helper substitutions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('units/05-the-mole/js/model.js')
          t = p.read_text(encoding='utf-8')
          old = 'export const ARI_INTRO = "ARI, the ship\'s junior AI, ran this job while you were off shift. It is still learning, and it picks up your habits, slips and all. Check its work before the number goes live.";'
          new = "export const ARI_INTRO = 'ARI, the ship\\'s junior AI, ran this job while you were off shift. It is still learning, and it picks up your habits, slips and all. Check its work before the number goes live.';"
          if t.count(old) != 1:
              raise SystemExit(f'Expected one legacy ARI_INTRO string, found {t.count(old)}')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('scripts/unit5_fidelity_refactor.py')
          t = p.read_text(encoding='utf-8')
          fixes = {
              'pat.subn(repl, t, count=1)': 'pat.subn(lambda m: repl, t, count=1)',
              'pat.subn(cap_method, t, count=1)': 'pat.subn(lambda m: cap_method, t, count=1)',
              "'Feel a mole', 'Purity check'": "'Purity check'",
          }
          for old, new in fixes.items():
              if old not in t:
                  raise SystemExit(f'Missing expected helper pattern: {old}')
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Apply reviewed Unit 5 language and scientific-fidelity changes
        run: python3 scripts/unit5_fidelity_refactor.py

      - name: Complete second-pass artwork and generated-log corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              n = t.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {n}')
              p.write_text(t.replace(old, new, 1), encoding='utf-8')

          replace_exact('units/05-the-mole/js/art.js', "mono(61, 26, 'HULL BREACH', { size: 7, ls: '.1em' })", "mono(61, 26, 'HEMATITE SAMPLE', { size: 7, ls: '.08em' })")
          replace_exact('units/05-the-mole/js/art.js', "mono(208, 105, 'PURITY', { size: 7, ls: '.12em' })", "mono(208, 105, '% BY MASS', { size: 7, ls: '.08em' })")
          replace_exact('units/05-the-mole/js/main.js', "capActionWord(k) { return k === 'approve' ? 'approved' : k === 'quarantine' ? 'quarantined' : 'rejected'; }", "capActionWord(k) { return k === 'approve' ? 'accepted' : k === 'quarantine' ? 'held for recheck' : 'rejected'; }")
          PY

      - name: Basic JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in units/05-the-mole/js/model.js units/05-the-mole/js/main.js units/05-the-mole/js/art.js units/05-the-mole/js/case.js shared/js/molezoom.js; do
            node --input-type=module --check < "$f"
          done

      - name: Second-pass student-facing source audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              'units/05-the-mole/index.html', 'units/05-the-mole/js/model.js',
              'units/05-the-mole/js/main.js', 'units/05-the-mole/js/art.js',
              'units/05-the-mole/js/case.js', 'shared/js/molezoom.js'
          ]
          texts = {p: Path(p).read_text(encoding='utf-8') for p in paths}
          joined = '\n'.join(texts.values())
          forbidden = [
              'Lock in an estimate', 'Commit your call', 'Commit the call', 'Make the call',
              'Wrong call', 'Right call', 'Purity check', 'DOES THE ASSAY MATCH?',
              'REAL % NITROGEN?', 'ID THE FLUID', 'CHECK PURITY', 'HULL BREACH',
              "'PURITY'", 'real value works out', 'does the number hold up', 'sign off',
              'a mole, about eighty thousand',
          ]
          found = [s for s in forbidden if s in joined]
          if found:
              raise SystemExit('Second-pass wording remnants: ' + ', '.join(found))
          index = texts['units/05-the-mole/index.html']
          main = texts['units/05-the-mole/js/main.js']
          model = texts['units/05-the-mole/js/model.js']
          case = texts['units/05-the-mole/js/case.js']
          art = texts['units/05-the-mole/js/art.js']
          zoom = texts['shared/js/molezoom.js']
          required = {
              'index percentage-point criterion': 'percentage points' in index,
              'index simulation score': 'Crew safety score' in index,
              'index mole scale label': 'aria-label="Mole scale"' in index,
              'main mole scale state': "return 'Mole scale'" in main,
              'model candidate qualification': 'reference candidates' in model,
              'art mass-composition label': "'% BY MASS'" in art,
              'case theoretical qualification': 'theoretical mass' in case,
              'case engineering qualification': 'design, airflow, operating conditions' in case,
              'shared 10^23 correction': 'one-sixth of a mole' in zoom,
          }
          missing = [k for k, ok in required.items() if not ok]
          if missing:
              raise SystemExit('Missing required fidelity text: ' + ', '.join(missing))
          if 'aria-label="Feel a mole"' in index or "return 'Feel a mole'" in main:
              raise SystemExit('Student-visible Feel a mole label remains')
          print('Second-pass static student-facing audit passed.')
          PY

      - name: Compare revised layout with original at required laptop viewports
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/u5check
          node compare.cjs revised /tmp/u5-revised.json /tmp/u5-baseline.json

      - name: Remove temporary implementation helpers
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/u5-http.pid ]; then kill "$(cat /tmp/u5-http.pid)" 2>/dev/null || true; fi
          rm -f scripts/unit5_fidelity_refactor.py scripts/unit5_layout_check.cjs scripts/unit5_layout_compare.cjs
          rm -f .github/workflows/unit5-fidelity-refactor.yml
          rm -f .github/workflows/unit5-fidelity-refactor-v2.yml
          rm -f .github/workflows/unit5-fidelity-refactor-v3.yml
          rm -f .github/workflows/unit5-fidelity-refactor-v4.yml
          rm -f .github/workflows/unit5-fidelity-refactor-v5.yml
          rm -f .github/workflows/unit5-fidelity-refactor-v6.yml
          rm -f .github/workflows/unit5-fidelity-refactor-v7.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rmdir scripts 2>/dev/null || true

      - name: Commit refined Unit 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Refine Unit 5 language and scientific fidelity"
          git push origin HEAD:main
