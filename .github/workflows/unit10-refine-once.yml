name: Unit 10 refinement runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply audited patch from previous revision
        shell: bash
        run: |
          git show HEAD^:.github/workflows/unit10-refine-once.yml > /tmp/unit10-old.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/unit10-old.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          a = text.index(start_marker) + len(start_marker)
          b = text.index(end_marker, a)
          lines = text[a:b].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, '/tmp/unit10_refine.py', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          git diff --stat
          git rm .github/workflows/unit10-refine-once.yml
          git add units/10-thermochemistry/index.html \
                  units/10-thermochemistry/js/model.js \
                  units/10-thermochemistry/js/main.js \
                  units/10-thermochemistry/js/case.js \
                  units/10-thermochemistry/js/art.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit and refine Unit 10 thermochemistry"
          git push origin HEAD:main
