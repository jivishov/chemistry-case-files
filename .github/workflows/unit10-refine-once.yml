name: Unit 10 refinement runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Apply audited Unit 10 patch
        shell: bash
        run: |
          git show b27c5615adae800435f86945ac456f1a711565f5:.github/workflows/unit10-refine-once.yml > /tmp/unit10-old.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/unit10-old.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          a = text.index(start_marker) + len(start_marker)
          b = text.index(end_marker, a)
          lines = text[a:b].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          marker = "# Sanity checks required by the audit."
          cleanup = """
          # Clean legacy developer comments that contain obsolete scientific wording.
          for cleanup_path in [
              'units/10-thermochemistry/js/model.js',
              'units/10-thermochemistry/js/main.js',
              'units/10-thermochemistry/js/art.js']:
              cleanup_text = read(cleanup_path)
              cleanup_text = cleanup_text.replace('shivering stops near 32', 'the original simulation used a 32 C threshold')
              cleanup_text = cleanup_text.replace('safe only at or above 33 C core', 'simulation movement criterion at or above 33 C')
              write(cleanup_path, cleanup_text)
          """
          code = code.replace(marker, cleanup + '\n' + marker, 1)
          exec(compile(code, '/tmp/unit10_refine.py', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          git diff --stat
          git rm .github/workflows/unit10-refine-once.yml
          git add units/10-thermochemistry/index.html \
                  units/10-thermochemistry/js/model.js \
                  units/10-thermochemistry/js/main.js \
                  units/10-thermochemistry/js/case.js \
                  units/10-thermochemistry/js/art.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit and refine Unit 10 thermochemistry"
          git push origin HEAD:main
