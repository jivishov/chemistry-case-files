name: Unit 7 scientific fidelity refinement

on:
  push:
    paths:
      - '.github/workflows/u7-scientific-refine-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine Unit 7 copy and scientific fidelity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/u7_refine_once.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('\nmust = {')
          s = s[:start] + "\nprint('Unit 7 refinement script completed successfully.')\n"
          p.write_text(s, encoding='utf-8')
          PY
          python3 tools/u7_refine_once.py

      - name: Basic static checks
        shell: bash
        run: |
          node --check units/07-gas-laws/js/model.js
          node --check units/07-gas-laws/js/main.js
          node --check units/07-gas-laws/js/art.js
          node --check units/07-gas-laws/js/case.js
          node --check shared/js/teks.js
          python3 - <<'PY'
          from pathlib import Path
          files = {
            'html': Path('units/07-gas-laws/index.html').read_text(encoding='utf-8'),
            'model': Path('units/07-gas-laws/js/model.js').read_text(encoding='utf-8'),
            'main': Path('units/07-gas-laws/js/main.js').read_text(encoding='utf-8'),
            'case': Path('units/07-gas-laws/js/case.js').read_text(encoding='utf-8'),
          }
          assert 'Unit 7 · TEKS C.10' in files['html']
          assert 'Scientific & Engineering Practices' not in files['html']
          assert files['html'].count('Activity tolerance:') == 1
          assert 'Activity pO₂ criterion' in files['html']
          assert 'Simulated reserve' in files['html']
          assert 'average translational kinetic energy' in files['model']
          assert 'root-mean-square' in files['model']
          assert 'activity criterion' in files['model']
          assert 'simulation reserve points' in files['main']
          assert 'root-mean-square (rms) molecular speed' in files['main']
          assert 'breathe normally' in files['case']
          assert 'arterial gas embolism' in files['case']
          assert 'model assumptions' in files['case']
          print('Static scientific/content checks passed.')
          PY

      - name: Install browser for laptop layout checks
        shell: bash
        run: |
          mkdir -p /tmp/u7-playwright
          cd /tmp/u7-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Check 15-inch laptop layouts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/u7_layout_check.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("await page.getByLabel('Reveal advanced content').check();", "await page.locator('.command-actions .switch').click();")
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/u7-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tools/u7_layout_check.js

      - name: Commit refined Unit 7
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/u7_refine_once.py tools/u7_layout_check.js
          git add units/07-gas-laws/index.html \
                  units/07-gas-laws/js/model.js \
                  units/07-gas-laws/js/main.js \
                  units/07-gas-laws/js/art.js \
                  units/07-gas-laws/js/case.js \
                  shared/js/teks.js
          git diff --cached --check
          git commit -m 'Refine Unit 7 scientific fidelity and student language'
          git push origin HEAD:main
