name: Diagnose deployed site in Chromium

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-browser-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Diagnose root and Unit 9
        run: |
          cat > diag.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          for (const url of [
            'https://jivishov.github.io/chemistry-case-files/',
            'https://jivishov.github.io/chemistry-case-files/units/09-acids-bases/'
          ]) {
            const page = await browser.newPage();
            const logs=[];
            page.on('console', m => logs.push(`console:${m.type()}: ${m.text()}`));
            page.on('pageerror', e => logs.push(`pageerror: ${e.message}`));
            page.on('requestfailed', r => logs.push(`requestfailed: ${r.url()} :: ${r.failure()?.errorText}`));
            const resp = await page.goto(url, {waitUntil:'networkidle', timeout:60000});
            await page.waitForTimeout(3500);
            const state = await page.evaluate(() => ({
              title: document.title,
              bodyText: document.body.innerText.slice(0,1600),
              cloakCount: document.querySelectorAll('[x-cloak]').length,
              appReady: window.__chemAppReady,
              alpine: window.Alpine?.version || null,
              fallbackHidden: document.getElementById('boot-fallback')?.hasAttribute('hidden') ?? null
            }));
            console.log('\nURL', url);
            console.log('HTTP', resp?.status());
            console.log('STATE', JSON.stringify(state, null, 2));
            console.log('LOGS', logs.join('\n') || '(none)');
            await page.close();
          }
          await browser.close();
          JS
          node diag.mjs
