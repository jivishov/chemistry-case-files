name: Unit 6 fidelity refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unit6-fidelity-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser checker and capture original laptop baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/u6-http.log 2>&1 &
          echo $! >/tmp/u6-http.pid
          mkdir -p /tmp/u6check
          cd /tmp/u6check
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/unit6_layout_compare.cjs" ./compare.cjs
          node compare.cjs baseline /tmp/u6-baseline.json

      - name: Apply reviewed Unit 6 language and scientific-fidelity changes
        run: python3 scripts/unit6_fidelity_refactor.py

      - name: Tighten artwork captions to the existing visual budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('units/06-reactions-stoichiometry/js/art.js')
          t = p.read_text(encoding='utf-8')
          fixes = {
              'H2O2 DECOMPOSITION - ONE REACTANT, TWO PRODUCTS': 'H2O2 DECOMPOSITION - ONE TO TWO',
              'THIS CALCULATION DOES NOT SET A REAL HAZARD ZONE': 'STOICHIOMETRY ONLY - NOT A HAZARD ZONE',
              'O2 REQUIRED FOR COMPLETE PROPANE COMBUSTION': 'PROPANE COMBUSTION - O2 REQUIRED',
              'LIMITING REACTANT - COMPLETE-COMBUSTION MODEL': 'LIMITING REACTANT - COMBUSTION MODEL',
              'LIMITING REACTANT SETS THEORETICAL NaCl': 'LIMITING REACTANT -> THEORETICAL NaCl',
              'LIMITING REACTANT SETS THEORETICAL AlCl3': 'LIMITING REACTANT -> THEORETICAL AlCl3',
              'MASS -> MOLES -> REPRESENTATIVE PARTICLES': 'MASS -> MOLES -> PARTICLE COUNT',
              'COMPARE REQUIRED AND SIMULATED AVAILABLE AMOUNTS': 'REQUIRED vs SIMULATED AVAILABLE',
          }
          for old, new in fixes.items():
              if old not in t:
                  raise SystemExit(f'Missing expected artwork caption: {old}')
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Basic JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in units/06-reactions-stoichiometry/js/model.js units/06-reactions-stoichiometry/js/main.js units/06-reactions-stoichiometry/js/art.js units/06-reactions-stoichiometry/js/case.js; do
            node --input-type=module --check < "$f"
          done

      - name: Second-pass student-facing source audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              'units/06-reactions-stoichiometry/index.html',
              'units/06-reactions-stoichiometry/js/model.js',
              'units/06-reactions-stoichiometry/js/main.js',
              'units/06-reactions-stoichiometry/js/art.js',
              'units/06-reactions-stoichiometry/js/case.js',
          ]
          texts = {p: Path(p).read_text(encoding='utf-8') for p in paths}
          joined = '\n'.join(texts.values())
          forbidden = [
              'Call it in', 'Make the call', 'Called it low', 'Called it high',
              '>on spec</div>', 'Book it back in', 'Certify C.9',
              'O2 GOES FIRST. THAT IS WHY IT IS CO.',
              'Your airbag solves stoichiometry at 300 km/h',
              'The number holds.', 'the way it actually runs',
              'The second question is optional.',
          ]
          found = [s for s in forbidden if s in joined]
          if found:
              raise SystemExit('Second-pass wording remnants: ' + ', '.join(found))

          required = {
              'compact header preserved': 'Unit 6 · TEKS C.9' in texts[paths[0]],
              'activity tolerance': 'within activity tolerance' in texts[paths[0]],
              'classification subtype required': 'select every subtype that applies' in texts[paths[0]],
              'rust qualification': 'Real rusting is a more complex electrochemical process involving water.' in texts[paths[1]],
              'methane model qualification': 'Oxygen-poor combustion can form CO and other products' in texts[paths[1]],
              'hazmat simulation qualification': 'activity rules, not real HAZMAT procedures' in texts[paths[1]],
              'TEKS D wording': 'Describe the concept of limiting reactants.' in texts[paths[2]],
              'redox qualification': 'a free element can be a clue; confirm that oxidation numbers change' in texts[paths[2]],
              'mass-to-mass route qualification': 'Mass-to-mass route' in texts[paths[2]],
              'art methane correction': 'LIMITING REACTANT SETS MAXIMUM CO2' in texts[paths[3]],
              'art simulation capstone': 'REQUIRED vs SIMULATED AVAILABLE' in texts[paths[3]],
              'historical airbag qualification': 'Many older inflators used sodium azide' in texts[paths[4]],
              'modern inflator qualification': 'modern inflators use several other propellant chemistries' in texts[paths[4]],
              'main cache version': "import('./js/main.js?v=u6-3')" in texts[paths[0]],
              'case cache version': "import('./js/case.js?v=u6-2')" in texts[paths[0]],
              'model cache version': "from './model.js?v=u6-3';" in texts[paths[2]],
              'art cache version': "from './art.js?v=u6-3';" in texts[paths[2]],
          }
          missing = [k for k, ok in required.items() if not ok]
          if missing:
              raise SystemExit('Missing required Unit 6 fidelity text: ' + ', '.join(missing))

          # The refactor is intentionally copy/scientific-fidelity work. Structural CSS must not change.
          print('Second-pass static student-facing audit passed.')
          PY

      - name: Compare revised layout with original at required laptop viewports
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/u6check
          node compare.cjs revised /tmp/u6-revised.json /tmp/u6-baseline.json

      - name: Confirm no Unit 6 structural CSS changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- units/06-reactions-stoichiometry/css/style.css

      - name: Remove temporary implementation helpers
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/u6-http.pid ]; then kill "$(cat /tmp/u6-http.pid)" 2>/dev/null || true; fi
          rm -f scripts/unit6_fidelity_refactor.py scripts/unit6_layout_compare.cjs
          rm -f .github/workflows/unit6-fidelity-refactor.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rmdir scripts 2>/dev/null || true

      - name: Commit refined Unit 6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Refine Unit 6 language and scientific fidelity"
          git push origin HEAD:main
