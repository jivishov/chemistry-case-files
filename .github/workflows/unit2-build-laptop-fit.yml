name: Unit 2 build laptop fit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unit2-build-laptop-fit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/unit2_build_laptop_fit.py
      - run: git diff --check
      - run: |
          rm -f .github/workflows/unit2-build-laptop-fit.yml .github/scripts/unit2_build_laptop_fit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fit Unit 2 Build gauges on laptop"
          git push origin main
