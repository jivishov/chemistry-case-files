name: Apply Unit 2 build assembler fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unit2-build-assembler-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply particle assembler patch
        run: |
          echo '' | base64 -d > /tmp/u2patch.py
          python3 /tmp/u2patch.py

      - name: Validate Unit 2 build behavior
        run: |
          node --check units/02-atomic-structure/js/main.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          js = Path('units/02-atomic-structure/js/main.js').read_text(encoding='utf-8')
          html = Path('units/02-atomic-structure/index.html').read_text(encoding='utf-8')
          required = ['buildChecked: false', 'get buildSolved()', 'stepProtons(d)', 'Element identity hidden until Check atom', '@click="stepProtons(-1)"', '@click="stepProtons(1)"', 'x-show="buildChecked"', ':disabled="buildSolved"', 'u2-build-assembler-1']
          blob = js + '\n' + html
          missing = [x for x in required if x not in blob]
          if missing:
              raise SystemExit(f'Missing build assembler markers: {missing}')
          forbidden = ["this.$watch('elZ', () => this.onElement())", 'this.elZ = 6; this.onElement();', '<select id="el"', '<div class="stp-fixed mono" x-text="elZ"></div>']
          present = [x for x in forbidden if x in blob]
          if present:
              raise SystemExit(f'Old answer-revealing build behavior remains: {present}')
          print('Unit 2 particle assembler static validation passed.')
          PY

      - name: Commit validated fix and remove temporary workflow
        run: |
          rm -f .github/workflows/unit2-build-assembler-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Unit 2 Build a particle assembler"
          git push origin main
