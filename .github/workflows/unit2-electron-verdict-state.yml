name: Finalize Unit 2 electron verdict state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unit2-electron-verdict-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch persistent electron verdict state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          p = Path('units/02-atomic-structure/js/main.js')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              "    get activeVerdict() { return this.modeVerdict[this.mode] || null; },",
              "    get activeVerdict() {\n      if (this.mode === 'config') return (this.electronTask === 'family' ? this.famVerdict : this.cfgVerdict) || null;\n      return this.modeVerdict[this.mode] || null;\n    },",
              'active electron verdict')
          s = one(s,
              "    commitFamily() {\n      const sc=this.familySc, ok=this.familyPick===sc.correct;",
              "    commitFamily() {\n      if (this.famVerdict && this.famVerdict.tone === 'success') return;\n      const sc=this.familySc, ok=this.familyPick===sc.correct;",
              'group repeat guard')
          s = one(s,
              "    commitConfig() {\n      const sc=this.configSc, challenge=this.configChallenge;",
              "    commitConfig() {\n      if (this.cfgVerdict && this.cfgVerdict.tone === 'success') return;\n      const sc=this.configSc, challenge=this.configChallenge;",
              'configuration repeat guard')
          p.write_text(s, encoding='utf-8')

          p = Path('units/02-atomic-structure/index.html')
          h = p.read_text(encoding='utf-8')
          h = one(h,
              '<button class="btn btn-accent" @click="commitFamily()" :disabled="!familyPick">Check group</button>',
              '<button class="btn btn-accent" @click="commitFamily()" :disabled="!familyPick || (famVerdict && famVerdict.tone===\'success\')">Check group</button>',
              'group button repeat guard')
          h = one(h,
              "  import { createSim } from './js/main.js?v=u2-mission-fix-3';",
              "  import { createSim } from './js/main.js?v=u2-mission-fix-4';",
              'cache bust')
          p.write_text(h, encoding='utf-8')
          PY

          node --check units/02-atomic-structure/js/main.js
          git diff --check

      - name: Commit final state fix
        run: |
          rm -f .github/workflows/unit2-electron-verdict-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve Unit 2 electron mission verdicts"
          git push origin main
