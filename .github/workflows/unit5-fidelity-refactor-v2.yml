name: Unit 5 fidelity refactor v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unit5-fidelity-refactor-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize legacy ARI source quoting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('units/05-the-mole/js/model.js')
          t = p.read_text(encoding='utf-8')
          old = 'export const ARI_INTRO = "ARI, the ship\'s junior AI, ran this job while you were off shift. It is still learning, and it picks up your habits, slips and all. Check its work before the number goes live.";'
          new = "export const ARI_INTRO = 'ARI, the ship\\'s junior AI, ran this job while you were off shift. It is still learning, and it picks up your habits, slips and all. Check its work before the number goes live.';"
          if t.count(old) != 1:
              raise SystemExit(f'Expected one legacy ARI_INTRO string, found {t.count(old)}')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply reviewed Unit 5 copy and fidelity changes
        run: python3 scripts/unit5_fidelity_refactor.py

      - name: Basic JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            units/05-the-mole/js/model.js \
            units/05-the-mole/js/main.js \
            units/05-the-mole/js/art.js \
            units/05-the-mole/js/case.js \
            shared/js/molezoom.js; do
            node --input-type=module --check < "$f"
          done

      - name: Laptop layout fidelity check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/u5-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          mkdir -p /tmp/u5check
          cd /tmp/u5check
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null
          cat > check.cjs <<'EOF'
          const { chromium } = require('playwright');

          const sizes = [
            { width: 1536, height: 864, name: '1536x864' },
            { width: 1366, height: 768, name: '1366x768' },
          ];

          function collectGeometry() {
            const visible = el => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
            const header = document.querySelector('.cockpit-command');
            const copy = document.querySelector('.screen-copy');
            const tabs = [...document.querySelectorAll('.station-nav .tab')].filter(visible);
            const tabRows = [...new Set(tabs.map(el => Math.round(el.getBoundingClientRect().top)))];
            return {
              viewport: [innerWidth, innerHeight],
              docScrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body.scrollWidth,
              headerHeight: header ? Math.round(header.getBoundingClientRect().height) : null,
              tabRows,
              copyClientHeight: copy ? copy.clientHeight : null,
              copyScrollHeight: copy ? copy.scrollHeight : null,
            };
          }

          async function checkCoreStates(page, sizeName) {
            const failures = [];
            const states = [
              ['molg', 'genConversion', 'molg', 3],
              ['particles', 'genConversion', 'particles', 3],
              ['percent', 'genPercent', null, 3],
              ['formula', 'genFormula', null, 3],
              ['capstone', 'genCapstone', null, 2],
            ];
            for (const [mode, fn, arg, repeats] of states) {
              for (let i = 0; i < repeats; i++) {
                await page.evaluate(({ mode, fn, arg }) => {
                  const s = window.Alpine.$data(document.querySelector('[x-data="sim()"]'));
                  if (mode === 'capstone') { s.genCapstone(); s.mode = 'capstone'; }
                  else { s.mode = mode; if (arg === null) s[fn](); else s[fn](arg); }
                }, { mode, fn, arg });
                await page.waitForTimeout(60);
                const g = await page.evaluate(collectGeometry);
                if (g.docScrollWidth > g.viewport[0] + 1 || g.bodyScrollWidth > g.viewport[0] + 1) failures.push(`${mode} ${i + 1}: horizontal overflow`);
                if (g.tabRows.length !== 1) failures.push(`${mode} ${i + 1}: navigation wrapped to ${g.tabRows.length} rows`);
                if (g.copyScrollHeight > g.copyClientHeight + 2) failures.push(`${mode} ${i + 1}: mission copy clipped (${g.copyScrollHeight}>${g.copyClientHeight})`);
                if (g.headerHeight > 92) failures.push(`${mode} ${i + 1}: header too tall (${g.headerHeight}px)`);
              }
            }
            await page.evaluate(() => {
              const s = window.Alpine.$data(document.querySelector('[x-data="sim()"]'));
              s.honors = true; s.mode = 'formula'; s.genFormula(); s.genHydrate(); s.genCombustion();
            });
            await page.waitForTimeout(60);
            let g = await page.evaluate(collectGeometry);
            if (g.docScrollWidth > g.viewport[0] + 1) failures.push('Honors: horizontal overflow');
            if (g.tabRows.length !== 1) failures.push('Honors: navigation wrapped');

            await page.getByRole('tab', { name: 'Case file' }).click();
            await page.waitForTimeout(100);
            const caseGeom = await page.evaluate(() => {
              const cf = document.querySelector('.casefile');
              const title = document.querySelector('.cf-title');
              return {
                visible: !!cf && cf.getClientRects().length > 0,
                right: cf ? cf.getBoundingClientRect().right : 0,
                titleRight: title ? title.getBoundingClientRect().right : 0,
                width: innerWidth,
              };
            });
            if (!caseGeom.visible) failures.push('Case File did not open');
            if (caseGeom.right > caseGeom.width + 1 || caseGeom.titleRight > caseGeom.width + 1) failures.push('Case File horizontal clipping');
            if (failures.length) throw new Error(`${sizeName}:\n- ${failures.join('\n- ')}`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const size of sizes) {
                const page = await browser.newPage({ viewport: { width: size.width, height: size.height } });
                await page.goto('http://127.0.0.1:8000/units/05-the-mole/', { waitUntil: 'networkidle', timeout: 60000 });
                await page.waitForFunction(() => window.Alpine && document.querySelector('[x-data="sim()"]'), null, { timeout: 30000 });
                await page.waitForTimeout(300);
                console.log(size.name, JSON.stringify(await page.evaluate(collectGeometry)));
                await checkCoreStates(page, size.name);
                await page.close();
              }
            } finally { await browser.close(); }
            console.log('Unit 5 laptop layout checks passed at 1536x864 and 1366x768.');
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          node check.cjs

      - name: Remove temporary refactor helpers
        run: |
          rm -f scripts/unit5_fidelity_refactor.py
          rm -f .github/workflows/unit5-fidelity-refactor.yml
          rm -f .github/workflows/unit5-fidelity-refactor-v2.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rmdir scripts 2>/dev/null || true

      - name: Commit refined Unit 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Refine Unit 5 language and scientific fidelity"
          git push origin HEAD:main
