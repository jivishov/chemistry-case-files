<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 10 · Thermochemistry</title>
<meta name="description" content="Heat Line: make mountain-rescue heat calculations with the laws of thermodynamics, chemical packs, q = mc(dT), and calorimetry. TEKS C.13.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bitter:wght@600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="../../shared/css/tokens.css">
<link rel="stylesheet" href="../../shared/css/base.css">
<link rel="stylesheet" href="../../shared/css/components.css">
<link rel="stylesheet" href="../../shared/css/casefile.css">
<link rel="stylesheet" href="../shared/cockpit.css?v=cockpit-3">
<link rel="stylesheet" href="css/style.css?v=u10-1">
</head>
<body>
<div x-data="sim" x-cloak>
  <main class="codex-shell cockpit-shell" aria-label="Unit 10 mission cockpit">
    <header class="cockpit-command">
      <div class="command-brand">
        <span class="command-kicker">Unit 10 · TEKS C.13</span>
        <a class="command-home" href="../index.html" title="All units">Thermochemistry</a>
        <span x-text="activeStationName"></span>
      </div>

      <nav class="station-nav" role="tablist" aria-label="Mission stations">
        <button class="tab" role="tab" :aria-selected="mode==='laws'" @click="setMode('laws')" aria-label="Read the situation" title="Read the situation · C.13(A) laws of thermodynamics"><span class="tab-full" aria-hidden="true">Read the situation</span><span class="tab-short" aria-hidden="true">Situation</span></button>
        <button class="tab" role="tab" :aria-selected="mode==='pack'" @click="setMode('pack')" aria-label="Pick the pack" title="Pick the pack · C.13(C) exothermic and endothermic processes"><span class="tab-full" aria-hidden="true">Pick the pack</span><span class="tab-short" aria-hidden="true">Pack</span></button>
        <button class="tab" role="tab" :aria-selected="mode==='warm'" @click="setMode('warm')" aria-label="Size the heat" title="Size the heat · C.13(D) q = mc(dT)"><span class="tab-full" aria-hidden="true">Size the heat</span><span class="tab-short" aria-hidden="true">Heat</span></button>
        <button class="tab" role="tab" :aria-selected="mode==='calorimeter'" @click="setMode('calorimeter')" aria-label="Calorimetry" title="Calorimetry · C.13(B) heat transfer"><span class="tab-full" aria-hidden="true">Calorimetry</span><span class="tab-short" aria-hidden="true">Calorim.</span></button>
        <button class="tab" role="tab" :class="{ 'is-locked': !capUnlocked }" :aria-selected="mode==='capstone'" @click="setMode('capstone')" aria-label="The call" title="The call · capstone"><span class="tab-full" aria-hidden="true">The call</span><span class="tab-short" aria-hidden="true">Call</span></button>
        <button class="tab" role="tab" :aria-selected="mode==='casefile'" @click="setMode('casefile')" aria-label="Case file" title="Case file · bomb calorimetry"><span class="tab-full" aria-hidden="true">Case file</span><span class="tab-short" aria-hidden="true">Case</span></button>
      </nav>

      <div class="command-actions">
        <label class="switch" title="Reveal advanced content for Honors sections">
          <input type="checkbox" x-model="honors">
          <span class="track"></span>
          <span class="label-text" :style="honors ? 'color:var(--honors-700)' : 'color:var(--muted)'">Honors</span>
        </label>
        <button class="btn btn-sm command-reset" @click="resetProgress()">Reset</button>
      </div>

      <div class="command-metrics" aria-label="Progress and rescue telemetry">
        <span class="metric-chip">XP <strong x-text="g_xp"></strong></span>
        <span class="metric-chip">Streak <strong x-text="g_streak"></strong></span>
        <div class="teks-wrap" @click.outside="teksOpen = false" @keydown.escape="teksOpen = false">
          <button type="button" class="teks-badge" :class="{ complete: teksMasteredCount === coreSkills.length }" :aria-expanded="teksOpen ? 'true' : 'false'" aria-label="TEKS standards progress" @click="teksOpen = !teksOpen">
            <span>TEKS</span>
            <strong><span x-text="teksMasteredCount"></span>/<span x-text="coreSkills.length"></span></strong>
          </button>
          <div class="teks-popover" x-show="teksOpen" x-cloak role="group" aria-label="TEKS C.13 standards">
            <template x-for="se in coreSkills" :key="se.id">
              <div class="teks-row" :class="{ active: se.mode===mode, mastered: gMastered(se.id) }">
                <span class="teks-row-head">
                  <span class="teks-row-code" x-text="se.code"></span>
                  <span class="teks-row-cap" x-text="seCaption(se)"></span>
                </span>
                <span class="teks-row-text" x-text="se.text"></span>
                <span class="teks-row-meter"><span class="teks-row-fill" :style="`width:${gMastery(se.id)*100}%`"></span></span>
              </div>
            </template>
          </div>
        </div>
      </div>
    </header>

    <div class="workbench-grid" x-show="mode!=='casefile'">
      <section class="mission-screen panel" :class="'tone-' + activeTone" aria-label="Active rescue mission">
        <div class="mission-frame">
          <div class="mission-screen-art" x-html="scArt(activeArtId)"></div>
          <div class="screen-scanline" aria-hidden="true"></div>
        </div>
        <div class="screen-status">
          <span class="screen-system" x-text="activeStationName"></span>
          <span class="screen-state" x-text="activeStateLabel"></span>
        </div>
        <div class="screen-copy">
          <p class="screen-goal" x-show="activeBrief" x-prose="activeBrief ? activeBrief.goal : ''"></p>
          <p class="screen-outcome" x-prose="activeOutcomeText"></p>
        </div>
        <!-- A native <details>, so the standing facts can be folded away and the art and the
             prompt take the rows back. Open by default, because facts a learner has to hunt
             for are not standing facts. The summary keeps .command-kicker: it is the same
             chrome eyebrow it was before it became a disclosure, and that class is what
             exempts it from the 14px legibility floor in tests/unit5a-layout.test.mjs.
             shared/cockpit.css styles it; the height media queries there still drop the whole
             card on a short viewport, which is the shell deciding there is no room rather
             than the learner deciding they want it elsewhere. -->
        <!-- Closed by default, and only here. Unit 06's, 09's, 10's and 11's reference sets run
             three wrapped facts to a 476px column -- a 150 to 170px card -- and this mission
             column does not have that alongside a full scenario prompt at 726px of viewport.
             The rows this unit used to reclaim it took by DROPPING the card outright below
             760px, so on every laptop in the matrix the standing facts were unreachable. A
             closed disclosure costs 23px, says the facts are there, and hands the choice to
             the learner. The other seven units ship it open, which is the shell's default. -->
        <details class="screen-reference" aria-label="Reference facts">
          <summary class="command-kicker">Reference</summary>
          <div class="screen-reference-body">
            <template x-for="r in activeReference" :key="r.k">
              <p class="ref-item"><span class="ref-k" x-text="r.k"></span><span class="ref-v" x-prose="r.v"></span></p>
            </template>
          </div>
        </details>
        <section class="instincts cockpit-instincts" aria-label="Rescue status">
          <span class="command-kicker">Rescue clock</span>
          <p>T+<strong x-text="elapsed"></strong> min · core <strong x-text="fmt(core) + ' C'"></strong></p>
        </section>
      </section>

      <section class="task-stack chem-console" aria-label="Thermochemistry workbench">
        <div class="panel" :class="{ 'is-active': mode==='laws' && lw }" x-show="mode==='laws' && lw">
          <template x-if="lw">
            <div>
              <p class="bench-intro">Name the law, then read the direction heat actually moves before committing the rescue call.</p>
              <p class="small muted mb-2">1. Which law settles this?</p>
              <div class="lawgrid">
                <template x-for="l in LAWS" :key="l.key">
                  <button class="choice" :data-state="lwLawState(l.key)" @click="lwPickLaw(l.key)"><span class="tag" x-text="l.tag"></span><span x-text="l.label"></span></button>
                </template>
              </div>
              <p class="small muted mt-3 mb-2" x-text="'2. ' + lw.sc.flow.prompt"></p>
              <div class="choice-grid">
                <template x-for="o in lw.sc.flow.options" :key="o.key"><button class="choice" :data-state="lwFlowState(o.key)" @click="lwPickFlow(o.key)" x-text="o.label"></button></template>
              </div>
              <div class="row call-row mt-3">
                <button class="btn btn-accent" @click="lwCommit()" :disabled="lwDone || !lwLaw || !lwFlow">Make the call</button>
                <button class="btn btn-ghost" x-show="lwChecked" @click="lwNext()">Next situation</button>
                <span class="call-hint" x-show="(!lwLaw || !lwFlow) && !lwDone" x-text="!lwLaw ? 'Name the law this situation is about.' : 'Now say which way the energy moves.'"></span>
              </div>
              <template x-if="lwVerdict"><div class="verdict mt-3" :class="'verdict-' + lwVerdict.tone"><div class="status"><span class="status-icon" x-text="lwVerdict.icon"></span><span class="status-state" x-text="lwVerdict.state"></span></div><span class="verdict-headline" x-prose="lwVerdict.headline"></span><span class="verdict-detail" x-prose="lwVerdict.detail"></span></div></template>
            </div>
          </template>
        </div>

        <div class="panel" :class="{ 'is-active': mode==='pack' && pk }" x-show="mode==='pack' && pk">
          <template x-if="pk">
            <div>
              <p class="bench-intro" x-text="pk.need === 'hot' ? 'You need heat going INTO the patient.' : 'You need heat coming OUT of the injury.'"></p>
              <p class="small muted mb-2">1. Which pouch do you open?</p>
              <div class="packgrid">
                <template x-for="p in pk.offered" :key="p.key"><button class="choice" :data-state="pkPackState(p.key)" @click="pkPickPack(p.key)"><span class="pname" x-text="p.name"></span><span class="mono small" x-ce="p.ce"></span><span class="pfeel" x-text="p.feel"></span></button></template>
              </div>
              <p class="small muted mt-3 mb-2">2. Classify the process running inside the pouch you picked.</p>
              <div class="choice-grid thermal-class-grid">
                <button class="choice" :data-state="pkClassState('exothermic')" @click="pkPickClass('exothermic')" :disabled="!pkPick">Exothermic (releases heat, dH &lt; 0)</button>
                <button class="choice" :data-state="pkClassState('endothermic')" @click="pkPickClass('endothermic')" :disabled="!pkPick">Endothermic (absorbs heat, dH &gt; 0)</button>
              </div>
              <div class="diagram-wrap" x-show="pkPick">
                <svg viewBox="0 0 520 240" role="img" aria-label="Reaction-coordinate energy diagram for the selected pack"><g x-html="diagramSvg()"></g></svg>
              </div>
              <p class="small muted mt-2" x-show="pkPick">The dH arrow is to scale against the value shown. The activation barrier height is schematic, drawn only to show that a reaction climbs before it falls.</p>
              <div class="row call-row mt-3">
                <button class="btn btn-accent" @click="pkCommit()" :disabled="pkDone || !pkPick || !pkClass">Use this pack</button>
                <button class="btn btn-ghost" x-show="pkChecked" @click="pkNext()">Next patient</button>
                <span class="call-hint" x-show="(!pkPick || !pkClass) && !pkDone" x-text="!pkPick ? 'Choose a pack first.' : 'Now say whether it is exothermic or endothermic.'"></span>
              </div>
              <template x-if="pkVerdict"><div class="verdict mt-3" :class="'verdict-' + pkVerdict.tone"><div class="status"><span class="status-icon" x-text="pkVerdict.icon"></span><span class="status-state" x-text="pkVerdict.state"></span></div><span class="verdict-headline" x-prose="pkVerdict.headline"></span><span class="verdict-detail" x-prose="pkVerdict.detail"></span></div></template>
            </div>
          </template>
        </div>

        <div class="panel" :class="{ 'is-active': mode==='warm' && wm }" x-show="mode==='warm' && wm">
          <template x-if="wm">
            <div>
              <p class="bench-intro">Choose the material constant and calculate the heat the stove must deliver. The answer you submit is in kJ.</p>
              <div class="readout">
                <div class="cell"><div class="k">material</div><div class="v" x-text="wm.material"></div></div>
                <div class="cell"><div class="k">mass</div><div class="v" x-text="fmt(wm.m) + ' g'"></div></div>
                <div class="cell"><div class="k">start</div><div class="v" x-text="fmt(wm.t0) + ' C'"></div></div>
                <div class="cell"><div class="k">target</div><div class="v" x-text="fmt(wm.t1) + ' C'"></div></div>
                <div class="cell"><div class="k">change dT</div><div class="v" x-text="fmt(wm.dT) + ' C'"></div></div>
              </div>
              <div class="eqn mt-3"><span x-tex="'q = m \\, c \\, \\Delta T'"></span></div>
              <div class="warm-inputs mt-3">
                <div class="field"><label for="wmat">Which specific heat applies?</label><select id="wmat" x-model="wmMat" :disabled="wmDone"><option value="" disabled>choose a material</option><template x-for="mt in FIELD_MATERIALS" :key="mt"><option :value="mt" x-text="mt + '  (' + fmt(cOf(mt)) + ' J/g per C)'"></option></template></select></div>
                <div class="field heat-answer"><label for="wq">Heat needed (kJ)</label><input id="wq" type="number" step="0.01" x-model="wmQ" :disabled="wmDone" placeholder="your value"></div>
              </div>
              <div class="eq-work mt-3" x-show="wmMat">
                <div class="eqline"><span x-text="'m = ' + fmt(wm.m) + ' g'"></span><span x-text="'c = ' + fmt(cOf(wmMat) || 0) + ' J/g per C'"></span><span x-text="'dT = ' + fmt(wm.dT) + ' C'"></span></div>
                <div class="eqline"><span>with that specific heat, q works out to</span><span class="calc" x-text="wmPreview === null ? '—' : fmt(wmPreview) + ' kJ'"></span></div>
              </div>
              <div class="row call-row mt-3"><button class="btn btn-accent" @click="wmRun()" :disabled="wmDone || !wmMat || wmQ===''" x-text="wm.sc.actionLabel"></button><button class="btn btn-ghost" x-show="wmChecked" @click="wmNext()">Next job</button><span class="call-hint" x-show="(!wmMat || wmQ === '') && !wmDone" x-text="!wmMat ? 'Say which specific heat applies.' : 'Now work out the heat and type it.'"></span></div>
              <template x-if="wmVerdict"><div class="verdict mt-3" :class="'verdict-' + wmVerdict.tone"><div class="status"><span class="status-icon" x-text="wmVerdict.icon"></span><span class="status-state" x-text="wmVerdict.state"></span></div><span class="verdict-headline" x-prose="wmVerdict.headline"></span><span class="verdict-detail" x-prose="wmVerdict.detail"></span><template x-if="wmVerdict.gauge"><div class="gauge"><div class="gauge-seg" :class="wmVerdict.gauge==='low' ? 'miss' : ''">too little</div><div class="gauge-seg" :class="wmVerdict.gauge==='on' ? 'on' : ''">on spec</div><div class="gauge-seg" :class="wmVerdict.gauge==='high' ? 'miss' : ''">too much</div></div></template></div></template>
            </div>
          </template>
        </div>

        <div class="panel" :class="{ 'is-active': mode==='calorimeter' && cl }" x-show="mode==='calorimeter' && cl">
          <template x-if="cl">
            <div>
              <p class="bench-intro">Nothing escapes the insulated pot. Set the heat the hot body loses equal to the heat the cold body gains, then predict their common temperature.</p>
              <div class="table-wrap"><table class="data calorimeter-data"><thead><tr><th>body</th><th>material</th><th class="num">mass (g)</th><th class="num">c (J/g per C)</th><th class="num">start (C)</th></tr></thead><tbody><tr><td>hot</td><td x-text="cl.hotMat"></td><td class="num" x-text="fmt(cl.hot.m)"></td><td class="num" x-text="fmt(cl.hot.c)"></td><td class="num" x-text="fmt(cl.hot.t)"></td></tr><tr><td>cold</td><td x-text="cl.coldMat"></td><td class="num" x-text="fmt(cl.cold.m)"></td><td class="num" x-text="fmt(cl.cold.c)"></td><td class="num" x-text="fmt(cl.cold.t)"></td></tr></tbody></table></div>
              <div class="eqn mt-3"><span x-tex="'q_{lost} = q_{gained}'"></span></div>
              <div class="field cal-answer mt-3"><label for="clt">Settling temperature (C)</label><input id="clt" type="number" step="0.01" x-model="clInput" :disabled="clDone" placeholder="your prediction"></div>
              <div class="row call-row mt-3"><button class="btn btn-accent" @click="clCommit()" :disabled="clDone || clInput===''" x-text="cl.sc.actionLabel"></button><button class="btn btn-ghost" x-show="clChecked" @click="clNext()">Next mix</button><span class="call-hint" x-show="clInput === '' && !clDone" x-text="'Work out the settling temperature, then type it.'"></span></div>
              <template x-if="clVerdict"><div class="cal-result"><div class="verdict mt-3" :class="'verdict-' + clVerdict.tone"><div class="status"><span class="status-icon" x-text="clVerdict.icon"></span><span class="status-state" x-text="clVerdict.state"></span></div><span class="verdict-headline" x-prose="clVerdict.headline"></span><span class="verdict-detail" x-prose="clVerdict.detail"></span><template x-if="clVerdict.gauge"><div class="gauge"><div class="gauge-seg" :class="clVerdict.gauge==='low' ? 'miss' : ''">too cold</div><div class="gauge-seg" :class="clVerdict.gauge==='on' ? 'on' : ''">on target</div><div class="gauge-seg" :class="clVerdict.gauge==='high' ? 'miss' : ''">too hot</div></div></template></div><div class="stat-row mt-2"><div class="stat"><div class="k">heat that moved</div><div class="v" x-text="fmt(cl.q / 1000) + ' kJ'"></div></div><div class="stat"><div class="k">settles at</div><div class="v" x-text="fmt(cl.tFinal) + ' C'"></div></div></div></div></template>

              <section class="honors-block" x-show="honors">
                <span class="honors-tag">Honors · Hess's law</span>
                <div class="note note-info mt-2" x-show="!gMastered('b')">Lock in calorimetry (three correct in a row) to unlock the Honors bench.</div>
                <template x-if="gMastered('b') && hs"><div class="mt-2"><p class="small muted mb-2" x-prose="hs.sc.goal"></p><p class="small" x-text="hs.route.story"></p><div class="note note-info mt-2">Target route: <span class="mono" x-ce="hs.target.ce"></span></div><p class="small muted mt-2 mb-2">Flip and scale the measurable steps until they add up to the target.</p><template x-for="(s,i) in hs.route.steps" :key="i"><div class="hess-row" :class="{ flipped: hsFlip[i] }"><span class="rxn mono small" x-ce="hsFlip[i] ? s.ce.split(' -> ').reverse().join(' -> ') : s.ce"></span><button class="btn btn-sm" @click="hsToggle(i)" x-text="hsFlip[i] ? 'Flipped' : 'Flip'"></button><span class="stepper"><span class="el">x</span><button class="btn btn-sm" @click="hsStep(i,-1)" :aria-label="'decrease scale on step ' + (i+1)">&minus;</button><span class="sub" x-text="hsScale[i]"></span><button class="btn btn-sm" @click="hsStep(i,1)" :aria-label="'increase scale on step ' + (i+1)">+</button></span><span class="term" x-text="(hsTermDH(i) > 0 ? '+' : '') + fmt(hsTermDH(i)) + ' kJ'"></span></div></template><div class="hess-total" :class="{ match: hsOk }"><span>your sum</span><span x-text="(hsTotal > 0 ? '+' : '') + fmt(hsTotal) + ' kJ'"></span><span class="muted small" x-text="'target ' + (hs.target.dH > 0 ? '+' : '') + fmt(hs.target.dH) + ' kJ'"></span></div><div class="row call-row mt-2"><button class="btn btn-honors" @click="hsCommit()" :disabled="hsDone">Send the number</button><button class="btn btn-ghost" x-show="hsChecked" @click="hsNext()">Next route</button></div><template x-if="hsVerdict"><div class="verdict mt-2" :class="'verdict-' + hsVerdict.tone"><div class="status"><span class="status-icon" x-text="hsVerdict.icon"></span><span class="status-state" x-text="hsVerdict.state"></span></div><span class="verdict-headline" x-prose="hsVerdict.headline"></span><span class="verdict-detail" x-prose="hsVerdict.detail"></span></div></template></div></template>
              </section>

              <section class="honors-block" x-show="honors">
                <span class="honors-tag">Honors · enthalpy from formation data</span>
                <div class="note note-info mt-2" x-show="!gMastered('b')">Lock in calorimetry to unlock the formation-data job.</div>
                <template x-if="gMastered('b') && fm"><div class="mt-2"><p class="small muted mb-2" x-prose="fm.sc.goal"></p><p class="small" x-text="fm.fc.story"></p><div class="eqn mt-2 mb-2"><span x-ce="fm.fc.ce"></span></div><div class="table-wrap"><table class="data fdata"><thead><tr><th>species</th><th class="num">dHf (kJ/mol)</th><th class="num">coefficient</th></tr></thead><tbody><tr><td class="side" colspan="3">reactants</td></tr><template x-for="s in fm.fc.reactants" :key="'r'+s.label"><tr><td class="mono" x-ce="s.label"></td><td class="num" x-text="fmt(s.dHf)"></td><td class="num" x-text="s.coefficient"></td></tr></template><tr><td class="side" colspan="3">products</td></tr><template x-for="s in fm.fc.products" :key="'p'+s.label"><tr><td class="mono" x-ce="s.label"></td><td class="num" x-text="fmt(s.dHf)"></td><td class="num" x-text="s.coefficient"></td></tr></template></tbody></table></div><p class="small muted mt-2">An element in its standard state has dHf = 0 by definition.</p><div class="formation-inputs mt-2"><div class="field heat-answer"><label for="fmv">dHrxn (kJ)</label><input id="fmv" type="number" step="0.1" x-model="fmInput" :disabled="fmDone" placeholder="your value"></div><div class="choice-grid"><button class="choice" :data-state="fmClassState('exothermic')" @click="fmPickClass('exothermic')">Exothermic</button><button class="choice" :data-state="fmClassState('endothermic')" @click="fmPickClass('endothermic')">Endothermic</button></div></div><div class="row call-row mt-2"><button class="btn btn-honors" @click="fmCommit()" :disabled="fmDone || fmInput==='' || !fmClass">File the report</button><button class="btn btn-ghost" x-show="fmChecked" @click="fmNext()">Next fuel</button><span class="call-hint" x-show="(fmInput === '' || !fmClass) && !fmDone" x-text="fmInput === '' ? 'Work out dHrxn from the formation values, then type it.' : 'Now say which way that number points.'"></span></div><template x-if="fmVerdict"><div class="verdict mt-2" :class="'verdict-' + fmVerdict.tone"><div class="status"><span class="status-icon" x-text="fmVerdict.icon"></span><span class="status-state" x-text="fmVerdict.state"></span></div><span class="verdict-headline" x-prose="fmVerdict.headline"></span><span class="verdict-detail" x-prose="fmVerdict.detail"></span></div></template></div></template>
              </section>
            </div>
          </template>
        </div>

        <div class="panel" :class="{ 'is-active': mode==='capstone' }" x-show="mode==='capstone'">
          <div class="note note-info" x-show="!capUnlocked">The evacuation call unlocks once all four core systems (C.13 A to D) are certified. Certified so far: <span x-text="Math.round(gOverall()*4)"></span> of 4.</div>
          <button class="btn btn-accent" x-show="capUnlocked && !cap" @click="genCapstone()">Take the radio</button>
          <template x-if="capUnlocked && cap"><div><p class="bench-intro">The defensible action is calculated from the cloud base and the core temperature your previous calls built.</p><div class="readout"><div class="cell"><div class="k">ledge</div><div class="v" x-text="fmt(cap.ledge) + ' m'"></div></div><div class="cell"><div class="k">cloud base</div><div class="v" x-text="fmt(cap.ceiling) + ' m'"></div></div><div class="cell"><div class="k">her core now</div><div class="v" x-text="fmt(cap.coreAtCall) + ' C'"></div></div></div><p class="small muted mt-2">An aircraft needs cloud base above the ledge to reach you. Moving a patient below 33 degrees Celsius risks washing cold blood from her limbs into her core.</p><p class="small muted mt-3 mb-2">Make the call.</p><div class="choice-grid"><template x-for="o in cap.sc.options" :key="o.key"><button class="choice" :data-state="capActionState(o.key)" @click="capPickAction(o.key)" x-text="o.label"></button></template></div><div class="row call-row mt-3"><button class="btn btn-accent" @click="capCommit()" :disabled="capWin || !capPick">Radio it in</button><span class="call-hint" x-show="!capPick && !capWin" x-text="'Make the call on the fire first.'"></span></div><template x-if="capVerdict"><div class="verdict mt-3" :class="'verdict-' + capVerdict.tone"><div class="status"><span class="status-icon" x-text="capVerdict.icon"></span><span class="status-state" x-text="capVerdict.state"></span></div><span class="verdict-headline" x-prose="capVerdict.headline"></span><span class="verdict-detail" x-prose="capVerdict.detail"></span></div></template></div></template>
        </div>
      </section>

      <aside class="life-support-board panel" aria-label="Patient status rail">
        <div class="life-header"><div><span class="command-kicker">Patient status</span><strong x-text="coreState"></strong></div><span class="sol-chip">T+<strong x-text="elapsed"></strong></span></div>
        <div class="crew-status cockpit-crew"><span class="crew-face" x-text="coreMood"></span><div class="crew-bar"><div class="life-meter-label"><span>Core temperature</span><span class="mono" x-text="fmt(core) + ' C'"></span></div><div class="meter"><div class="meter-fill" :style="`width:${corePct}%; background:${coreColor}`"></div></div></div></div>
        <div class="system-grid" aria-label="Rescue readouts"><template x-for="r in coreReadings" :key="r.key"><div class="ship-stock"><div class="life-meter-label"><span x-text="r.label" :title="r.hint"></span><span class="mono" x-text="r.raw"></span></div><div class="meter"><div class="meter-fill" :style="`width:${r.pct}%; background:${stockColor(r.pct)}`"></div></div></div></template></div>
        <section class="latest-consequence" :class="'tone-' + activeTone" aria-label="Latest consequence"><span class="command-kicker">Latest consequence</span><strong x-text="activeStateLabel"></strong><p x-text="worldLog.length ? worldLog[0].text : 'No calls logged yet. The clock starts when you make one.'"></p></section>
        <section class="mission-log" aria-label="Rescue log"><span class="command-kicker">Rescue log</span><p class="worldstate-empty" x-show="!worldLog.length">No calls written down yet.</p><ul class="worldstate-list" x-show="worldLog.length"><template x-for="w in worldLog.slice(0, 3)" :key="w.id"><li class="worldstate-entry" :class="w.tone==='success' ? 'good' : (w.tone==='warn' ? 'warn' : 'bad')"><span class="ws-icon" x-text="w.icon"></span><span x-text="w.text"></span></li></template></ul></section>
      </aside>
    </div>

    <div data-casefile></div>
  </main>
</div>

<script type="module">
  window.deferLoadingAlpine = (start) => { window.__startAlpine = start; };
  const [{ createSim }, { registerRender }, { registerGauge }, { mountCaseFile }, { CASE },
         { mountColumnResizers }] = await Promise.all([
    import('./js/main.js?v=u10-1'),
    import('../../shared/js/render.js'),
    import('../../shared/js/gauge.js'),
    import('../../shared/js/casefile.js'),
    import('./js/case.js?v=u10-1'),
    import('../shared/columns.js?v=cockpit-3')
  ]);
  window.sim = createSim;
  const { default: Alpine } = await import('https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/module.esm.js');
  registerRender(Alpine);
  registerGauge(Alpine);
  Alpine.data('sim', createSim);
  mountCaseFile(Alpine, CASE);
  window.Alpine = Alpine;
  if (window.__startAlpine) window.__startAlpine();
  else Alpine.start();
  // After start(), so the handles are appended to a workbench Alpine has already claimed.
  // The two gutter buttons carry no bindings, so Alpine never walks them.
  mountColumnResizers();
</script>
</body>
</html>
